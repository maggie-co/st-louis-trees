<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Extent — St. Louis Flood &amp; Canopy</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root {
    --bg: #161616;
    --panel: #1a1a1a;
    --border: #3a3a3a;
    --text: #e8e8e8;
    --muted: #999999;
    --accent: #f7d03c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Times New Roman', Times, serif;
  }
  #map { position: absolute; inset: 0; }

  #panel {
    position: absolute;
    top: 16px;
    left: 16px;
    width: 290px;
    max-height: calc(100% - 32px);
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 16px;
    z-index: 2;
  }
  #panel h1 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    margin: 0 0 4px;
  }
  #panel .subtitle {
    font-size: 12px;
    font-style: italic;
    color: var(--muted);
    margin: 0 0 16px;
  }
  .back-link {
    display: inline-block;
    font-size: 12px;
    color: var(--accent);
    text-decoration: none;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    width: 100%;
  }
  .back-link:hover {
    color: #fff;
  }
  .group-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 16px 0 4px;
  }
  .group-label:first-of-type { margin-top: 0; }

  .layer-row {
    padding: 6px 0;
    border-top: 1px solid var(--border);
    font-size: 13.5px;
    position: relative;
  }
  .group-label + .layer-row { border-top: none; }
  .layer-row .row-main {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .layer-row label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .swatch {
    width: 10px;
    height: 10px;
    flex: none;
    border-radius: 2px;
  }
  .layer-row input[type="checkbox"] {
    accent-color: var(--accent);
  }
  .info-btn {
    width: 16px;
    height: 16px;
    flex: none;
    border-radius: 50%;
    border: 1px solid var(--muted);
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    font-family: 'Times New Roman', Times, serif;
    line-height: 14px;
    text-align: center;
    cursor: pointer;
    padding: 0;
  }
  .info-btn.active {
    border-color: var(--accent);
    color: var(--accent);
  }
  .info-popover {
    display: none;
    margin-top: 6px;
    background: #111111;
    border: 1px solid var(--border);
    padding: 10px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }
  .info-popover.open { display: block; }
  .info-popover strong { color: var(--text); display: block; margin-bottom: 4px; }
  .info-popover .cite {
    display: block;
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid var(--border);
    font-style: italic;
    font-size: 11px;
  }

  .maplibregl-popup-content {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    font-family: 'Times New Roman', Times, serif;
    font-size: 13px;
    padding: 10px 12px;
    max-width: 260px;
  }
  .maplibregl-popup-tip { border-top-color: var(--panel) !important; }
  .maplibregl-popup-close-button { color: var(--muted); }
</style>
</head>
<body>

<div id="map"></div>

<div id="panel">
  <a href="index.html" class="back-link">← Back to overview</a>
  <h1>Project Extent</h1>
  <p class="subtitle">Site-specific conditions</p>
  <div id="layer-list"></div>
</div>

<script>
const INFERNO_STOPS = [
  '#000004', '#1b0c41', '#4a0c6b', '#781c6d', '#a52c60',
  '#cf4446', '#ed6925', '#fb9a06', '#f7d03c', '#fcffa4'
];
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbToHex(rgb) {
  return '#' + rgb.map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
}
function infernoColor(t) {
  t = Math.max(0, Math.min(1, t));
  const scaled = t * (INFERNO_STOPS.length - 1);
  const i = Math.floor(scaled);
  const frac = scaled - i;
  if (i >= INFERNO_STOPS.length - 1) return INFERNO_STOPS[INFERNO_STOPS.length - 1];
  const a = hexToRgb(INFERNO_STOPS[i]);
  const b = hexToRgb(INFERNO_STOPS[i + 1]);
  return rgbToHex(a.map((v, idx) => v + (b[idx] - v) * frac));
}
function bandColors(start, end, count) {
  if (count === 1) return [infernoColor((start + end) / 2)];
  const colors = [];
  for (let i = 0; i < count; i++) {
    colors.push(infernoColor(start + (end - start) * (i / (count - 1))));
  }
  return colors;
}
const WATER_COLORS = bandColors(0.06, 0.06, 1);
const HYDRO_COLORS = bandColors(0.30, 0.30, 2);
const FLOOD_COLORS = bandColors(0.54, 0.54, 2);
const MSD_COLORS = bandColors(0.76, 0.90, 3);
const CANOPY_COLORS = bandColors(1.0, 1.0, 1);
const TORNADO_COLORS = bandColors(0.64, 0.72, 2);

const LAYERS = [
  {
    id: 'trees', file: 'trees_slim.json', geomType: 'point', group: 'Canopy', showInfo: true,
    label: 'Trees', color: CANOPY_COLORS[0], defaultOn: true,
    source: 'City of St. Louis Tree Inventory',
    detail: 'Point shapefile, reprojected from NAD83 StatePlane MO East (ftUS) to WGS84. DBH = diameter at breast height (trunk diameter measured 4.5ft above ground), the standard forestry measure of tree size. (2020)',
    popup: f => `<strong>${f.species || 'Unknown species'}</strong><br>DBH: ${f.dbh}"<br>Condition: ${f.condition || 'n/a'}<br>${f.address || ''}`
  },
  {
    id: 'rivers-lakes', file: 'rivers_and_lakes.json', geomType: 'polygon', group: 'Water bodies', showInfo: true,
    label: 'Rivers and Lakes', color: WATER_COLORS[0], defaultOn: true,
    source: 'City of St. Louis Flood Risk Map (STLOUIS RIVERS + HistoricLakes)',
    detail: 'Named rivers and lakes, merged into one layer. 27 features: 25 rivers, 2 lakes (one no longer open water). (2020)',
    popup: f => `<strong>${f.name || f.kind}</strong><br>${f.kind}${f.municipality ? ' — ' + f.municipality + ', ' + f.state : ''}${f.source_detail ? '<br>Source: ' + f.source_detail : ''}`
  },
  {
    id: 'historic-streams', file: 'historic_streams.json', geomType: 'line', group: 'Hydrology history', showInfo: true,
    label: 'Historic streams', color: HYDRO_COLORS[0], defaultOn: true,
    source: 'City of St. Louis Flood Risk Map (HistoricStreams)',
    detail: 'Streams from historical maps, many since piped or buried. 275 features. (1904)',
    popup: f => `<strong>${f.Name || 'Unnamed historic stream'}</strong><br>Source: ${f.Source || 'n/a'}, ${f.Publicatio || ''}`
  },
  {
    id: 'modern-hydro', file: 'modern_hydro_flow_routes.json', geomType: 'line', group: 'Hydrology history', showInfo: true,
    label: 'Modern flow routes', color: HYDRO_COLORS[1], defaultOn: true,
    source: 'City of St. Louis Flood Risk Map (ModernHydroFlowRoutes)',
    detail: 'Modeled current-day surface flow paths, derived hydrology. 136 features. (2020)',
    popup: f => `<strong>Modeled flow route</strong>`
  },
  {
    id: 'floodplain', file: 'stl_floodplain.json', geomType: 'polygon', group: 'Flood risk', showInfo: true,
    label: 'FEMA floodplain (city-curated)', color: FLOOD_COLORS[0], defaultOn: true,
    source: 'City of St. Louis Flood Risk Map (STL_Floodplain)',
    detail: 'FLD_ZONE / SFHA_TF classification, 329 features. City-maintained FEMA-derived layer. (2020)',
    popup: f => `<strong>Flood zone ${f.FLD_ZONE || ''}</strong><br>SFHA: ${f.SFHA_TF === 'T' ? 'Yes' : 'No'}<br>Floodway: ${f.FLOODWAY || 'n/a'}`
  },
  {
    id: 'impacted-blocks', file: 'impacted_blocks_flood_2022.json', geomType: 'polygon', group: 'Flood risk', showInfo: true,
    label: 'July 2022 flood-impacted parcels', color: FLOOD_COLORS[1], defaultOn: true,
    source: 'City of St. Louis Emergency Management Agency',
    detail: '752 parcels reported via 2-1-1 / United Way calls after the July 25, 2022 flash flood. Fields include damage type, extent, insurance status. (2022)',
    popup: f => `<strong>${(f.address || '').trim()}</strong><br>${f.structure_type || ''}<br>Damage: ${f.water_damage_amount || 'n/a'} (${f.water_damage_location || ''})<br>Insurance contacted: ${f.insurance_contacted || 'n/a'}`
  },
  {
    id: 'msd-problem-areas', file: 'msd_problem_areas.json', geomType: 'polygon', group: 'MSD infrastructure', showInfo: true,
    label: 'MSD problem areas', color: MSD_COLORS[0], defaultOn: true,
    source: 'Metropolitan St. Louis Sewer District (MSD_ProblemAreas)',
    detail: '77 known stormwater/sewer problem areas identified by MSD. (2020)',
    popup: f => `<strong>MSD problem area</strong><br>${f.PROBAREA || ''}`
  },
  {
    id: 'msd-stormwater-projects', file: 'msd_large_stormwater_projects.json', geomType: 'polygon', group: 'MSD infrastructure', showInfo: true,
    label: 'MSD large stormwater projects', color: MSD_COLORS[1], defaultOn: true,
    source: 'Metropolitan St. Louis Sewer District (MSD_LargeScale_Stormwater_Projects)',
    detail: '262 parcels within large-scale MSD stormwater project footprints. (2020)',
    popup: f => `<strong>${(f.address || '').trim() || 'Stormwater project parcel'}</strong><br>${f.subtype || ''} ${f.poly_type || ''}<br>${f.notes || ''}`
  },
  {
    id: 'msd-ownership', file: 'msd_ownership.json', geomType: 'polygon', group: 'MSD infrastructure', showInfo: true,
    label: 'MSD-owned parcels', color: MSD_COLORS[2], defaultOn: true,
    source: 'Metropolitan St. Louis Sewer District (MSD_OWNERSHIP)',
    detail: '292 parcels owned by MSD. (2020)',
    popup: f => `<strong>${f.Address || 'MSD parcel'}</strong><br>${f.Owner_1 || ''}`
  },
  {
    id: 'project-extent', file: 'newstead_ave_site.json', geomType: 'polygon', group: 'Portfolio Sites', showInfo: true,
    label: 'Project Extent', color: '#ffffff', defaultOn: true,
    source: 'Google Maps Project — Green Infrastructure Analysis Zone',
    detail: 'Primary project boundary for green infrastructure assessment and investment planning. Encompasses priority area for tree canopy expansion and stormwater management. Overlaps with flood-impacted zones and identifies strategic opportunity sites for intervention.',
    popup: f => `<strong>${f.name || 'Project Extent'}</strong>`,
    zoomToFeature: false
  }
];

const panel = document.getElementById('layer-list');
let lastGroup = null;
LAYERS.forEach(l => {
  if (l.group !== lastGroup) {
    const gl = document.createElement('div');
    gl.className = 'group-label';
    gl.textContent = l.group;
    panel.appendChild(gl);
    lastGroup = l.group;
  }
  const row = document.createElement('div');
  row.className = 'layer-row';
  row.innerHTML = `
    <div class="row-main">
      <label>
        <input type="checkbox" id="toggle-${l.id}" ${l.defaultOn ? 'checked' : ''}>
        <span class="swatch" style="background:${l.color}"></span>
        ${l.label}
      </label>
      ${l.showInfo ? `<button type="button" class="info-btn" id="info-btn-${l.id}">i</button>` : ''}
    </div>
    ${l.showInfo ? `
      <div class="info-popover" id="info-popover-${l.id}">
        <strong>${l.label}</strong>
        ${l.detail}
        <span class="cite">Source: ${l.source}</span>
      </div>
    ` : ''}
  `;
  panel.appendChild(row);
});

document.querySelectorAll('.info-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const id = btn.id.replace('info-btn-', '');
    const pop = document.getElementById(`info-popover-${id}`);
    const isOpen = pop.classList.contains('open');
    document.querySelectorAll('.info-popover.open').forEach(p => p.classList.remove('open'));
    document.querySelectorAll('.info-btn.active').forEach(b => b.classList.remove('active'));
    if (!isOpen) {
      pop.classList.add('open');
      btn.classList.add('active');
    }
  });
});
document.addEventListener('click', () => {
  document.querySelectorAll('.info-popover.open').forEach(p => p.classList.remove('open'));
  document.querySelectorAll('.info-btn.active').forEach(b => b.classList.remove('active'));
});

const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {
      'dark-basemap': {
        type: 'raster',
        tiles: [
          'https://a.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png',
          'https://b.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png',
          'https://c.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png',
          'https://d.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png'
        ],
        tileSize: 256,
        attribution: '&copy; <a href="https://carto.com/attributions">CARTO</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }
    },
    layers: [
      {
        id: 'background',
        type: 'background',
        paint: { 'background-color': '#161616' }
      },
      {
        id: 'dark-basemap-layer',
        type: 'raster',
        source: 'dark-basemap',
        paint: { 'raster-opacity': 0.85 }
      }
    ]
  },
  center: [-90.23326, 38.67452],
  zoom: 15.5
});

map.addControl(new maplibregl.NavigationControl(), 'top-right');

map.on('load', () => {
  const popup = new maplibregl.Popup({ closeButton: true, closeOnClick: true });

  LAYERS.forEach(l => {
    map.addSource(l.id, { type: 'geojson', data: `data/${l.file}` });

    if (l.geomType === 'point') {
      map.addLayer({
        id: l.id, type: 'circle', source: l.id,
        layout: { visibility: l.defaultOn ? 'visible' : 'none' },
        paint: {
          'circle-radius': ['interpolate', ['linear'], ['zoom'], 0, 0.15, 14, 1, 17, 5, 20, 10],
          'circle-color': l.color,
          'circle-opacity': ['interpolate', ['linear'], ['zoom'], 0, 0.4, 12, 0.7, 20, 0.9],
          'circle-stroke-width': 0
        }
      });
    } else if (l.geomType === 'line') {
      map.addLayer({
        id: l.id, type: 'line', source: l.id,
        layout: { visibility: l.defaultOn ? 'visible' : 'none' },
        paint: {
          'line-color': l.color,
          'line-width': 1.2,
          'line-opacity': 0.85
        }
      });
    } else {
      map.addLayer({
        id: l.id + '-fill', type: 'fill', source: l.id,
        layout: { visibility: l.defaultOn ? 'visible' : 'none' },
        paint: { 'fill-color': l.color, 'fill-opacity': 0.3 }
      });
      map.addLayer({
        id: l.id + '-line', type: 'line', source: l.id,
        layout: { visibility: l.defaultOn ? 'visible' : 'none' },
        paint: { 'line-color': l.color, 'line-width': 0.6, 'line-opacity': 0.7 }
      });
    }

    const clickLayerId = l.geomType === 'polygon' ? l.id + '-fill' : l.id;
    map.on('click', clickLayerId, (e) => {
      const f = e.features[0].properties;
      popup.setLngLat(e.lngLat).setHTML(l.popup(f)).addTo(map);
    });
    map.on('mouseenter', clickLayerId, () => {
      map.getCanvas().style.cursor = 'pointer';
    });
    map.on('mouseleave', clickLayerId, () => {
      map.getCanvas().style.cursor = '';
    });

    document.getElementById(`toggle-${l.id}`).addEventListener('change', (e) => {
      const vis = e.target.checked ? 'visible' : 'none';
      if (l.geomType === 'polygon') {
        map.setLayoutProperty(l.id + '-fill', 'visibility', vis);
        map.setLayoutProperty(l.id + '-line', 'visibility', vis);
      } else {
        map.setLayoutProperty(l.id, 'visibility', vis);
      }
    });
  });
});
</script>

</body>
</html>
