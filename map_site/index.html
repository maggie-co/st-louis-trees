<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>St. Louis Flood &amp; Canopy Infrastructure</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<style>
  :root {
    --bg: #161616;
    --panel: #1a1a1a;
    --border: #3a3a3a;
    --text: #e8e8e8;
    --muted: #999999;
    --accent: #f7d03c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Times New Roman', Times, serif;
  }
  #map { position: absolute; inset: 0; }

  #panel {
    position: absolute;
    top: 16px;
    left: 16px;
    width: 290px;
    max-height: calc(100% - 32px);
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 16px;
    z-index: 2;
  }
  #panel h1 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    margin: 0 0 4px;
  }
  #panel .subtitle {
    font-size: 12px;
    font-style: italic;
    color: var(--muted);
    margin: 0 0 16px;
  }
  .group-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin: 16px 0 4px;
    font-weight: 600;
  }
  .group-label:first-of-type { margin-top: 0; }

  .layer-row {
    padding: 6px 0;
    border-top: 1px solid var(--border);
    font-size: 13.5px;
    position: relative;
  }
  .group-label + .layer-row { border-top: none; }
  .layer-row .row-main {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .layer-row label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .swatch {
    width: 10px;
    height: 10px;
    flex: none;
    border-radius: 2px;
  }
  .layer-row input[type="checkbox"] {
    accent-color: var(--accent);
  }
  .info-btn {
    width: 16px;
    height: 16px;
    flex: none;
    border-radius: 50%;
    border: 1px solid var(--muted);
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    font-family: 'Times New Roman', Times, serif;
    line-height: 14px;
    text-align: center;
    cursor: pointer;
    padding: 0;
  }
  .info-btn.active {
    border-color: var(--accent);
    color: var(--accent);
  }
  .info-popover {
    display: none;
    margin-top: 6px;
    background: #111111;
    border: 1px solid var(--border);
    padding: 10px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }
  .info-popover.open { display: block; }
  .info-popover strong { color: var(--text); display: block; margin-bottom: 4px; }
  .info-popover .cite {
    display: block;
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid var(--border);
    font-style: italic;
    font-size: 11px;
  }

  .maplibregl-popup-content {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    font-family: 'Times New Roman', Times, serif;
    font-size: 13px;
    padding: 10px 12px;
    max-width: 260px;
  }
  .maplibregl-popup-tip { border-top-color: var(--panel) !important; }
  .maplibregl-popup-close-button { color: var(--muted); }
</style>
</head>
<body>

<div id="map"></div>

<div id="panel">
  <h1>St. Louis Flood &amp; Canopy Infrastructure</h1>
  <button id="export-btn" style="width:100%; padding:8px; margin-bottom:12px; background:#2a2a2a; color:#ccc; border:1px solid #666; cursor:pointer; font-family:inherit; font-size:12px;">📥 Export Visible Layers</button>
  <div id="layer-list"></div>
</div>

<script>
/*
 * Inferno colormap approximation (matplotlib "inferno"), sampled at 10
 * canonical stops and linearly interpolated in RGB space for arbitrary t.
 * Used to give each layer group its own band of the palette.
 */
const INFERNO_STOPS = [
  '#000004', '#1b0c41', '#4a0c6b', '#781c6d', '#a52c60',
  '#cf4446', '#ed6925', '#fb9a06', '#f7d03c', '#fcffa4'
];
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbToHex(rgb) {
  return '#' + rgb.map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
}
function infernoColor(t) {
  t = Math.max(0, Math.min(1, t));
  const scaled = t * (INFERNO_STOPS.length - 1);
  const i = Math.floor(scaled);
  const frac = scaled - i;
  if (i >= INFERNO_STOPS.length - 1) return INFERNO_STOPS[INFERNO_STOPS.length - 1];
  const a = hexToRgb(INFERNO_STOPS[i]);
  const b = hexToRgb(INFERNO_STOPS[i + 1]);
  return rgbToHex(a.map((v, idx) => v + (b[idx] - v) * frac));
}
/* Assign each group a band of the colormap; layers within a group are
 * spread evenly across that band. Ordered dark -> bright, deliberately
 * pushed toward the extremes for contrast against the dark canvas:
 * water (deep indigo/black) -> hydrology history (violet) -> flood risk
 * (magenta-red) -> MSD infrastructure (orange) -> canopy (sole bright
 * pale-yellow highlight, reserved for this one layer only). */
function bandColors(start, end, count) {
  if (count === 1) return [infernoColor((start + end) / 2)];
  const colors = [];
  for (let i = 0; i < count; i++) {
    colors.push(infernoColor(start + (end - start) * (i / (count - 1))));
  }
  return colors;
}
/*
 * Layer config. Each entry describes one source/layer pair.
 * geomType drives which MapLibre layer type + paint we build.
 * showInfo controls whether the group gets a clickable info icon.
 * source/detail are shown in the click-triggered info popover as the
 * short description + cited source.
 *
 * Six-group color ramp (top of legend -> bottom), per requested palette:
 * Proposed Redesign Site, Tornado, MSD, FEMA flood, Water & Canopy, City Boundary.
 */
/* mako-inspired ramp (dark purple -> blue -> teal -> pale green),
 * ordered top-of-legend (darkest/most purple) to bottom (lightest). */
const SITE_COLOR = '#2a1a4d';
const TORNADO_COLOR = '#817f9f';
const MSD_COLOR = '#2f6b8a';
const FEMA_COLOR = '#3a9188';
const WATERCANOPY_COLOR = '#8fcf9f';
const BOUNDARY_COLOR = '#6b6b6b';

const LAYERS = [
  {
    id: 'proposed-redesign-site', file: 'newstead_ave_site.json', geomType: 'polygon', group: null, showInfo: false,
    label: 'Proposed Redesign Site', color: '#808080', opacity: 0.55, defaultOn: true,
    source: 'Newstead Ave (Kossuth to Carter Ave)',
    detail: 'Site boundary for proposed green infrastructure redesign.',
    noPopup: true
  },
  {
    id: 'tornado-path', file: 'tornado_path_2025.json', geomType: 'polygon', group: 'May 2025 Tornado', showInfo: true,
    label: 'Tornado path (EF-3)', color: TORNADO_COLOR, opacity: 0.7, defaultOn: true,
    source: 'City of St. Louis / National Weather Service',
    detail: 'May 16, 2025 EF-3 tornado track. Path width: 3,168 yards (1.8 miles). Survey date: June 2, 2025. Revised assessment with 10,000+ damage points published June 2026. (2025)',
    popup: f => `<strong>EF-${f.ef_rank} Tornado — May 16, 2025</strong><br>Structures exposed: ${f.structures_exposed || 'n/a'}`
  },
  {
    id: 'msd-ownership', file: 'msd_ownership.json', geomType: 'polygon', group: 'MSD infrastructure', showInfo: true,
    label: 'MSD-owned parcels', color: '#abe0ab', opacity: 0.78, defaultOn: true,
    source: 'Metropolitan St. Louis Sewer District (MSD_OWNERSHIP)',
    detail: '292 parcels owned by MSD. (2020)',
    popup: f => `<strong>${f.Address || 'MSD parcel'}</strong><br>${f.Owner_1 || ''}`
  },
  {
    id: 'msd-stormwater-projects', file: 'msd_large_stormwater_projects.json', geomType: 'polygon', group: 'MSD infrastructure', showInfo: true,
    label: 'MSD large stormwater projects', color: '#8cc08c', opacity: 0.82, defaultOn: true,
    source: 'Metropolitan St. Louis Sewer District (MSD_LargeScale_Stormwater_Projects)',
    detail: '262 parcels within large-scale MSD stormwater project footprints. (2020)',
    popup: f => `<strong>${(f.address || '').trim() || 'Stormwater project parcel'}</strong><br>${f.subtype || ''} ${f.poly_type || ''}<br>${f.notes || ''}`
  },
  {
    id: 'msd-problem-areas', file: 'msd_problem_areas.json', geomType: 'polygon', group: 'MSD infrastructure', showInfo: true,
    label: 'MSD problem areas', color: '#6a8c6a', opacity: 0.88, defaultOn: true,
    source: 'Metropolitan St. Louis Sewer District (MSD_ProblemAreas)',
    detail: '77 known stormwater/sewer problem areas identified by MSD. (2020)',
    popup: f => `<strong>MSD problem area</strong><br>${f.PROBAREA || ''}`
  },
  {
    id: 'modern-hydro', file: 'modern_hydro_flow_routes.json', geomType: 'line', group: 'Water & Canopy', showInfo: true,
    label: 'Modern flow routes', color: '#6d97b8', strokeWidth: 1.8, strokeOpacity: 0.7, defaultOn: true,
    source: 'City of St. Louis Flood Risk Map (ModernHydroFlowRoutes)',
    detail: 'Modeled current-day surface flow paths, derived hydrology. 136 features. (2020)',
    popup: f => `<strong>Modeled flow route</strong>`
  },
  {
    id: 'rivers-lakes', file: 'rivers_and_lakes.json', geomType: 'polygon', group: 'Water & Canopy', showInfo: true,
    label: 'Rivers and Lakes', color: '#7797ad', opacity: 0.25, defaultOn: true,
    source: 'City of St. Louis Flood Risk Map (STLOUIS RIVERS + HistoricLakes)',
    detail: 'Named rivers and lakes, merged into one layer. 27 features: 25 rivers, 2 lakes (one no longer open water). (2020)',
    popup: f => `<strong>${f.name || f.kind}</strong><br>${f.kind}${f.municipality ? ' — ' + f.municipality + ', ' + f.state : ''}${f.source_detail ? '<br>Source: ' + f.source_detail : ''}`
  },
  {
    id: 'floodplain', file: 'stl_floodplain.json', geomType: 'polygon', group: 'Water & Canopy', showInfo: true,
    label: 'FEMA floodplain', color: '#6d97ad', opacity: 0.5, defaultOn: true,
    source: 'City of St. Louis Flood Risk Map (STL_Floodplain)',
    detail: 'FLD_ZONE / SFHA_TF classification, 329 features. City-maintained FEMA-derived layer. (2020)',
    popup: f => `<strong>Flood zone ${f.FLD_ZONE || ''}</strong><br>SFHA: ${f.SFHA_TF === 'T' ? 'Yes' : 'No'}<br>Floodway: ${f.FLOODWAY || 'n/a'}`
  },
  {
    id: 'trees', file: 'trees_slim.json', geomType: 'point', group: 'Water & Canopy', showInfo: true,
    label: 'Trees', color: '#b8b8b8', defaultOn: true,
    source: 'City of St. Louis Tree Inventory',
    detail: 'Point shapefile, reprojected from NAD83 StatePlane MO East (ftUS) to WGS84. DBH = diameter at breast height (trunk diameter measured 4.5ft above ground), the standard forestry measure of tree size. (2020)',
    popup: f => `<strong>${f.species || 'Unknown species'}</strong><br>DBH: ${f.dbh}"<br>Condition: ${f.condition || 'n/a'}<br>${f.address || ''}`
  },
  {
    id: 'stl-boundary', file: 'st_louis_city_boundary.json', geomType: 'polygon', group: null, showInfo: false,
    label: 'St. Louis City Boundary', color: '#000000', opacity: 0, strokeWidth: 1.5, strokeOpacity: 0.8, defaultOn: true, outlineOnly: true,
    source: 'City of St. Louis',
    detail: 'Municipal boundary outline.',
    popup: f => `<strong>St. Louis City Boundary</strong>`
  },
  {
    id: 'bounding-box', geomType: 'line', group: null, showInfo: false,
    label: 'Bounding Box', color: '#000000', opacity: 1, strokeWidth: 1.5, strokeOpacity: 0.8, defaultOn: true,
    source: 'Map Extent',
    detail: 'St. Louis city boundary rectangle',
    geom: {
      type: 'FeatureCollection',
      features: [{
        type: 'Feature',
        properties: {},
        geometry: {
          type: 'LineString',
          coordinates: [
            [-90.330, 38.520],
            [-90.157, 38.520],
            [-90.157, 38.785],
            [-90.330, 38.785],
            [-90.330, 38.520]
          ]
        }
      }]
    }
  },
];

const panel = document.getElementById('layer-list');

let lastGroup = null;
const HATCH_CSS = {
  'hatch-45': 'repeating-linear-gradient(45deg, ' + MSD_COLOR + ' 0 2px, transparent 2px 6px)',
  'hatch-neg45': 'repeating-linear-gradient(-45deg, ' + MSD_COLOR + ' 0 2px, transparent 2px 6px)',
  'hatch-cross': 'repeating-linear-gradient(45deg, ' + MSD_COLOR + ' 0 2px, transparent 2px 6px), repeating-linear-gradient(-45deg, ' + MSD_COLOR + ' 0 2px, transparent 2px 6px)'
};
LAYERS.forEach(l => {
  if (l.group !== lastGroup) {
    if (l.group) {
      const gl = document.createElement('div');
      gl.className = 'group-label';
      gl.textContent = l.group;
      panel.appendChild(gl);
    }
    lastGroup = l.group;
  }
  const swatchStyle = l.pattern ? `background:${HATCH_CSS[l.pattern]}` : `background:${l.color}`;
  const row = document.createElement('div');
  row.className = 'layer-row';
  row.innerHTML = `
    <div class="row-main">
      <label>
        <input type="checkbox" id="toggle-${l.id}" ${l.defaultOn ? 'checked' : ''}>
        <span class="swatch" style="${swatchStyle}"></span>
        ${l.label}
      </label>
      ${l.showInfo ? `<button type="button" class="info-btn" id="info-btn-${l.id}">i</button>` : ''}
    </div>
    ${l.showInfo ? `
      <div class="info-popover" id="info-popover-${l.id}">
        <strong>${l.label}</strong>
        ${l.detail}
        <span class="cite">Source: ${l.source}</span>
      </div>
    ` : ''}
  `;
  panel.appendChild(row);
});

// Basemap toggle (not part of LAYERS — controls the raster tiles/background/mask, not a data source).
// Placed last so it renders as the lowest/bottom row in the legend, matching its position as the lowest map layer.
const basemapRow = document.createElement('div');
basemapRow.className = 'layer-row';
basemapRow.innerHTML = `
  <div class="row-main">
    <label>
      <input type="checkbox" id="toggle-basemap" checked>
      <span class="swatch" style="background:#6b6b6b"></span>
      Basemap
    </label>
  </div>
`;
panel.appendChild(basemapRow);

// Click-to-toggle info popovers; clicking elsewhere or the same icon closes them.
document.querySelectorAll('.info-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const id = btn.id.replace('info-btn-', '');
    const pop = document.getElementById(`info-popover-${id}`);
    const isOpen = pop.classList.contains('open');
    document.querySelectorAll('.info-popover.open').forEach(p => p.classList.remove('open'));
    document.querySelectorAll('.info-btn.active').forEach(b => b.classList.remove('active'));
    if (!isOpen) {
      pop.classList.add('open');
      btn.classList.add('active');
    }
  });
});
document.addEventListener('click', () => {
  document.querySelectorAll('.info-popover.open').forEach(p => p.classList.remove('open'));
  document.querySelectorAll('.info-btn.active').forEach(b => b.classList.remove('active'));
});

// Export visible layers (and basemap, if checked) as a PNG cropped to the Bounding Box
document.getElementById('export-btn').addEventListener('click', async () => {
  const anyChecked = Array.from(document.querySelectorAll('.layer-row input[type="checkbox"]')).some(cb => cb.checked);
  if (!anyChecked) {
    alert('Select at least one layer to export');
    return;
  }

  const btn = document.getElementById('export-btn');
  btn.disabled = true;
  btn.textContent = '📥 Exporting...';

  // Basemap visibility already reflects the Basemap checkbox — export as-is.

  // Crop exactly to the Bounding Box layer's coordinates
  const bboxLayer = LAYERS.find(l => l.id === 'bounding-box');
  const bboxCoords = bboxLayer.geom.features[0].geometry.coordinates;
  const lons = bboxCoords.map(c => c[0]);
  const lats = bboxCoords.map(c => c[1]);
  const minLon = Math.min(...lons), maxLon = Math.max(...lons);
  const minLat = Math.min(...lats), maxLat = Math.max(...lats);
  const latMid = (minLat + maxLat) / 2;
  const realAspect = ((maxLon - minLon) * Math.cos(latMid * Math.PI / 180)) / (maxLat - minLat);

  // Temporarily size the map container to match the bounding box aspect ratio for an exact crop
  const container = map.getContainer();
  const targetWidth = 3600;
  const targetHeight = Math.round(targetWidth / realAspect);
  const origWidth = container.style.width;
  const origHeight = container.style.height;
  const origCenter = map.getCenter();
  const origZoom = map.getZoom();
  container.style.width = targetWidth + 'px';
  container.style.height = targetHeight + 'px';
  map.resize();
  map.fitBounds([[minLon, minLat], [maxLon, maxLat]], { padding: 0, duration: 0, animate: false });

  // Thicken lines/dots/polygon outlines for export only — the live map is untouched by these restores.
  // Circle radius uses a flat literal (not a multiplier) because the interpolated on-screen
  // value at the export's fitBounds zoom is tiny (~1-2px) — 2x of tiny is still tiny.
  const EXPORT_LINE_SCALE = 2.5;
  const EXPORT_CIRCLE_RADIUS = 8;
  // Boundary/extent reference lines get extra emphasis on export — flat width + full opacity.
  const EXPORT_EMPHASIS_LINES = { 'stl-boundary-line': 7, 'bounding-box': 7, 'modern-hydro': 12 };
  const scaledPaint = [];
  map.getStyle().layers.forEach(sl => {
    if (sl.type === 'circle') {
      const orig = map.getPaintProperty(sl.id, 'circle-radius');
      if (orig !== undefined) {
        map.setPaintProperty(sl.id, 'circle-radius', EXPORT_CIRCLE_RADIUS);
        scaledPaint.push({ id: sl.id, prop: 'circle-radius', orig });
      }
    } else if (sl.type === 'line') {
      const origWidth = map.getPaintProperty(sl.id, 'line-width');
      if (origWidth !== undefined) {
        if (EXPORT_EMPHASIS_LINES[sl.id] !== undefined) {
          map.setPaintProperty(sl.id, 'line-width', EXPORT_EMPHASIS_LINES[sl.id]);
          const origOpacity = map.getPaintProperty(sl.id, 'line-opacity');
          map.setPaintProperty(sl.id, 'line-opacity', 1);
          scaledPaint.push({ id: sl.id, prop: 'line-opacity', orig: origOpacity });
        } else {
          map.setPaintProperty(sl.id, 'line-width', ['*', origWidth, EXPORT_LINE_SCALE]);
        }
        scaledPaint.push({ id: sl.id, prop: 'line-width', orig: origWidth });
      }
    }
  });

  try {
    // Wait for the map to repaint at the new size. The export container is much larger than the
    // on-screen map, so it requests far more basemap tiles than usual — give it real time to land
    // instead of racing a short fallback timer (which caused patchy/half-loaded basemap tiles).
    await new Promise(resolve => {
      map.once('idle', resolve);
      map.triggerRepaint();
      setTimeout(resolve, 6000); // generous fallback in case idle never fires
    });
    // Extra safety: keep polling until the basemap raster source itself reports fully loaded.
    const waitStart = Date.now();
    while (!map.isSourceLoaded('dark-basemap') && Date.now() - waitStart < 5000) {
      await new Promise(r => setTimeout(r, 150));
    }

    // The long wait above occasionally lands on a fully blank WebGL frame (backgrounded tab,
    // dropped GPU context, etc.) — detect that and force a fresh repaint before giving up.
    function isCanvasBlank(canvas) {
      const probeCtx = document.createElement('canvas').getContext('2d');
      probeCtx.canvas.width = canvas.width;
      probeCtx.canvas.height = canvas.height;
      probeCtx.drawImage(canvas, 0, 0);
      const { data } = probeCtx.getImageData(0, 0, canvas.width, canvas.height);
      for (let i = 3; i < data.length; i += 4 * 977) {
        if (data[i] !== 0) return false;
      }
      return true;
    }

    let mapCanvas = map.getCanvas();
    let attempts = 0;
    while (isCanvasBlank(mapCanvas) && attempts < 3) {
      attempts++;
      map.resize();
      await new Promise(resolve => {
        map.once('idle', resolve);
        map.triggerRepaint();
        setTimeout(resolve, 2000);
      });
      mapCanvas = map.getCanvas();
    }

    const dataUrl = mapCanvas.toDataURL('image/png');

    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = 'stl-layers.png';
    a.click();
  } finally {
    // Restore original line/circle widths
    scaledPaint.forEach(({ id, prop, orig }) => {
      if (map.getLayer(id)) map.setPaintProperty(id, prop, orig);
    });

    // Restore original size and view
    container.style.width = origWidth;
    container.style.height = origHeight;
    map.resize();
    map.jumpTo({ center: origCenter, zoom: origZoom });

    btn.disabled = false;
    btn.textContent = '📥 Export Visible Layers';
  }
});

window.map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {
      'dark-basemap': {
  type: 'raster',
  tiles: [
    'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}'
  ],
  tileSize: 256,
  maxzoom: 16,
  attribution: '&copy; <a href="https://www.esri.com/">Esri</a>'
},
    },
    layers: [
      {
        id: 'background',
        type: 'background',
        paint: { 'background-color': '#e8e8e8' }
      },
      {
        id: 'dark-basemap-layer',
        type: 'raster',
        source: 'dark-basemap',
        paint: { 'raster-opacity': 1, 'raster-contrast': 0.15, 'raster-saturation': 0.1 }
      }
    ]
  },
  center: [-90.25, 38.63],
  zoom: 11.5,
  maxZoom: 16,
  preserveDrawingBuffer: true
});

map.addControl(new maplibregl.NavigationControl(), 'top-right');

const BASEMAP_LAYER_IDS = ['background', 'dark-basemap-layer', 'street-labels', 'city-mask-layer', 'city-emphasis-layer'];

map.on('load', () => {
  document.getElementById('toggle-basemap').addEventListener('change', (e) => {
    const vis = e.target.checked ? 'visible' : 'none';
    BASEMAP_LAYER_IDS.forEach(id => {
      if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', vis);
    });
  });

  map.addSource('osm-labels', {
    type: 'vector',
    tiles: ['https://tile.openstreetmap.org/data/v3/{z}/{x}/{y}.pbf'],
    minzoom: 0,
    maxzoom: 14
  });
  
  map.addLayer({
    id: 'street-labels',
    type: 'symbol',
    source: 'osm-labels',
    'source-layer': 'transportation',
    layout: {
      'text-field': ['get', 'name'],
      'text-size': 12,
      'text-max-width': 12,
      'visibility': ['case', ['>=', ['zoom'], 14], 'visible', 'none']
    },
    paint: {
      'text-color': '#4a4a4a',
      'text-halo-color': '#e8e8e8',
      'text-halo-width': 1
    }
  }, 'trees'); // Insert before trees layer

  const popup = new maplibregl.Popup({ closeButton: true, closeOnClick: true });

  /* Generate diagonal-hatch pattern tiles so same-color polygon layers
   * (MSD infrastructure) stay visually distinct without extra colors. */
  function makeHatchPattern(color, angleDeg, cross) {
    const size = 16;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, size, size);
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.globalAlpha = 0.9;
    const draw = (deg) => {
      ctx.save();
      ctx.translate(size / 2, size / 2);
      ctx.rotate(deg * Math.PI / 180);
      ctx.beginPath();
      ctx.moveTo(-size, 0);
      ctx.lineTo(size, 0);
      ctx.stroke();
      ctx.restore();
    };
    draw(angleDeg);
    if (cross) draw(angleDeg + 90);
    return ctx.getImageData(0, 0, size, size);
  }
  map.addImage('hatch-45', makeHatchPattern(MSD_COLOR, 45, false));
  map.addImage('hatch-neg45', makeHatchPattern(MSD_COLOR, -45, false));
  map.addImage('hatch-cross', makeHatchPattern(MSD_COLOR, 45, true));

  /* Inverted city-boundary mask: darkens everything OUTSIDE the city limits. */
  fetch('data/st_louis_city_boundary.json')
    .then(r => r.json())
    .then(cityData => {
      const cityRing = cityData.features[0].geometry.coordinates[0];
      const worldRing = [[-180, -85], [180, -85], [180, 85], [-180, 85], [-180, -85]];
      const maskGeoJSON = {
        type: 'FeatureCollection',
        features: [{
          type: 'Feature',
          properties: {},
          geometry: { type: 'Polygon', coordinates: [worldRing, cityRing] }
        }]
      };
      map.addSource('city-mask', { type: 'geojson', data: maskGeoJSON });
      /* Hard clip outside city limits — fully hides the basemap beyond the boundary (matches the
         page's basemap background color so it reads as a clean cutoff, not a visible grey block).
         Inserted below the first data layer (this fetch resolves after LAYERS.forEach has already run)
         so it only hides the basemap — data layers like the Bounding Box stay unaffected even where
         they extend past the city limits. */
      const firstDataLayerId = map.getLayer('proposed-redesign-site-fill') ? 'proposed-redesign-site-fill' : undefined;
      map.addLayer({
        id: 'city-mask-layer', type: 'fill', source: 'city-mask',
        layout: { visibility: 'visible' },
        paint: { 'fill-color': '#e8e8e8', 'fill-opacity': 1 }
      }, firstDataLayerId);

      /* Subtle dark overlay INSIDE the city limits — deepens/sharpens the basemap there for
         visual emphasis, playing against the hard clip outside for stronger inside/outside contrast. */
      const cityPolyFeature = turf.polygon([cityRing]);
      const cityFillGeoJSON = {
        type: 'FeatureCollection',
        features: [{ type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: [cityRing] } }]
      };
      map.addSource('city-fill', { type: 'geojson', data: cityFillGeoJSON });
      map.addLayer({
        id: 'city-emphasis-layer', type: 'fill', source: 'city-fill',
        layout: { visibility: 'visible' },
        paint: { 'fill-color': '#000000', 'fill-opacity': 0.14 }
      }, firstDataLayerId);

      /* Clip the tornado path to the city limits too — cut its geometry down to the
         portion inside St. Louis instead of just visually masking it. */
      fetch('data/tornado_path_2025.json')
        .then(r => r.json())
        .then(tornadoData => {
          const clipped = { type: 'FeatureCollection', features: [] };
          tornadoData.features.forEach(f => {
            try {
              const intersection = turf.intersect(f, cityPolyFeature);
              if (intersection) {
                intersection.properties = f.properties;
                clipped.features.push(intersection);
              }
            } catch (e) { /* skip features that fail to intersect */ }
          });
          const tornadoSource = map.getSource('tornado-path');
          if (tornadoSource) tornadoSource.setData(clipped);
        });
    });

  LAYERS.forEach(l => {
    if (l.id === 'city-boundary') return; // handled by the inverted mask above
    const sourceData = l.geom ? l.geom : `data/${l.file}`;
    map.addSource(l.id, { type: 'geojson', data: sourceData });

    if (l.geomType === 'point') {
      map.addLayer({
        id: l.id, type: 'circle', source: l.id,
        layout: { visibility: l.defaultOn ? 'visible' : 'none' },
        paint: {
          'circle-radius': ['interpolate', ['linear'], ['zoom'], 0, 0.2, 14, 1.1, 17, 3.8, 20, 7],
          'circle-color': l.color,
          'circle-opacity': ['interpolate', ['linear'], ['zoom'], 0, 0.4, 12, 0.7, 20, 0.9],
          'circle-stroke-width': 0
        }
      });
    } else if (l.geomType === 'line') {
      map.addLayer({
        id: l.id, type: 'line', source: l.id,
        layout: { visibility: l.defaultOn ? 'visible' : 'none' },
        paint: {
          'line-color': l.color,
          'line-width': l.strokeWidth || 1.2,
          'line-opacity': l.strokeOpacity !== undefined ? l.strokeOpacity : 0.85
        }
      });
    } else {
      // Outline-only polygons (no fill)
      if (l.outlineOnly) {
        map.addLayer({
          id: l.id + '-line', type: 'line', source: l.id,
          layout: { visibility: l.defaultOn ? 'visible' : 'none' },
          paint: { 'line-color': l.color, 'line-width': l.strokeWidth || 2, 'line-opacity': l.strokeOpacity !== undefined ? l.strokeOpacity : 1 }
        });
      } else {
        const fillPaint = { 'fill-color': l.color, 'fill-opacity': l.opacity !== undefined ? l.opacity : 0.3 };
        map.addLayer({
          id: l.id + '-fill', type: 'fill', source: l.id,
          layout: { visibility: l.defaultOn ? 'visible' : 'none' },
          paint: fillPaint
        });
        map.addLayer({
          id: l.id + '-line', type: 'line', source: l.id,
          layout: { visibility: l.defaultOn ? 'visible' : 'none' },
          paint: { 'line-color': l.color, 'line-width': 0.6, 'line-opacity': 0.7 }
        });
      }
    }

    const clickLayerId = l.geomType === 'polygon' ? (l.outlineOnly ? l.id + '-line' : l.id + '-fill') : l.id;
    if (!l.noPopup && l.id !== 'bounding-box') {
      map.on('click', clickLayerId, (e) => {
        const f = e.features[0].properties;
        popup.setLngLat(e.lngLat).setHTML(l.popup(f)).addTo(map);
      });
    }

    // Click to zoom (skip bounding box)
    if (l.id !== 'bounding-box') {
      map.on('click', clickLayerId, (e) => {
        const bounds = turf.bbox(e.features[0]);
        map.fitBounds(bounds, { padding: 100, duration: 1000 });
      });
    }
    map.on('mouseenter', clickLayerId, () => {
      map.getCanvas().style.cursor = 'pointer';
    });
    map.on('mouseleave', clickLayerId, () => {
      map.getCanvas().style.cursor = '';
    });

    document.getElementById(`toggle-${l.id}`).addEventListener('change', (e) => {
      const vis = e.target.checked ? 'visible' : 'none';
      if (l.outlineOnly) {
        map.setLayoutProperty(l.id + '-line', 'visibility', vis);
      } else if (l.geomType === 'polygon') {
        map.setLayoutProperty(l.id + '-fill', 'visibility', vis);
        map.setLayoutProperty(l.id + '-line', 'visibility', vis);
      } else {
        map.setLayoutProperty(l.id, 'visibility', vis);
      }
    });
  });

  // Render the tornado path above Trees, independent of its position in the legend/LAYERS array.
  if (map.getLayer('tornado-path-fill') && map.getLayer('stl-boundary-line')) {
    map.moveLayer('tornado-path-fill', 'stl-boundary-line');
    map.moveLayer('tornado-path-line', 'stl-boundary-line');
  }
});
</script>

</body>
</html>
